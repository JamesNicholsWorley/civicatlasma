name: Rebuild the generated pages

# `audit.html` is a static shell; `defects.js` is the data behind it. Only the
# data ages, which is why the page could look current while listing records that
# had been resolved a day earlier and omitting defects found since. CLAUDE.md
# points agents at that page to find work, so a stale one sends them to work that
# is already done.
#
# The generator lives in muni-harvest (see pages/README.md there) because it
# could not live here: this repository is generated output, and the thing that
# generates it is not. The script computes its own root two directories up and
# reads a particular layout, so rather than fork it for CI, the layout is
# assembled here and the script runs unchanged -- the same code the owner runs on
# his own machine.
#
# Runs when the corpus changes, not on every push, or committing defects.js
# would trigger a rebuild of defects.js.

on:
  push:
    branches: [main]
    paths:
      - 'json/**'
      - 'json_pre2021/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: civicatlasma-pages
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: The corpus
        uses: actions/checkout@v4

      - name: The generator
        uses: actions/checkout@v4
        with:
          repository: JamesNicholsWorley/muni-harvest
          path: .tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble the layout the script expects
        run: |
          mkdir -p work/data/inventory work/publish work/research/interface/enrollment
          cp .tools/pages/audit_defects.py        work/research/interface/
          cp .tools/pages/coverage_report.py      work/
          cp .tools/pages/inventory/*.csv         work/data/inventory/
          cp .tools/config/denominators.csv       work/research/interface/enrollment/
          ln -s "$GITHUB_WORKSPACE/json"          work/publish/json

      - name: Rebuild the defect register
        run: python work/research/interface/audit_defects.py

      # Coverage was generated locally and copied here by hand, so it aged
      # against a register that rebuilds itself -- the two pages were four
      # hours apart and disagreeing. The generator reads one CSV, writes one
      # page and touches no network, so there was never a reason for it to be
      # manual. It runs in THIS job rather than a new workflow on purpose:
      # the concurrency group cancels in progress, and a second workflow in
      # the same group would cancel this one at random.
      - name: Rebuild the coverage page
        env:
          COVERAGE_MASTER: .tools/pages/inventory/master_urls.csv
          COVERAGE_POPULATION: .tools/config/population.csv
          COVERAGE_PRE2021: json_pre2021
          COVERAGE_OUT: coverage.html
        run: python work/coverage_report.py

      # The map's earlier half. Unlike build_mvp.py -- which needs the raw OCR,
      # the extracted text and the source PDFs, none of which are in this
      # repository -- this one reads only the published records plus the URL
      # manifests, so it can run here. That is the whole reason the pre-2021
      # bundle is a separate file: this half rebuilds itself, and the 2021-2026
      # half still cannot.
      - name: Rebuild the pre-2021 map bundle
        run: |
          python .tools/pages/build_pre2021.py \
            --json-dir json_pre2021 \
            --root .tools \
            --out mvp/mvp-pre2021.js \
            --town-dir mvp/town_pre2021

      - name: Commit what changed
        run: |
          cp work/research/interface/defects.js defects.js
          # The index and its detail files are ONE output. Checking only the
          # index would let a rebuild that changed nothing but a town's ballots
          # report "unchanged" and publish neither, leaving the two halves of
          # the split disagreeing with each other on the live site.
          if git diff --quiet defects.js coverage.html mvp/mvp-pre2021.js mvp/town_pre2021 \
             && [ -z "$(git status --porcelain mvp/town_pre2021)" ]; then
            echo "the generated pages are unchanged"; exit 0
          fi
          git config user.name "civicatlas-qa"
          git config user.email "jamesnicholsworleyassistant@gmail.com"
          git add -A defects.js coverage.html mvp/mvp-pre2021.js mvp/town_pre2021
          git commit             -m "Rebuild the generated pages against the corpus as it now stands"             -m "The register is derived from json/, and json/ moved. Rebuilt by .github/workflows/rebuild-pages.yml so the page cannot quietly age again."
          git push origin main
