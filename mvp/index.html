<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Massachusetts Civic Atlas</title>
<meta name="description" content="Annual municipal election results for the 351 municipalities of Massachusetts, with the source document behind every figure.">
<style>
/* ---------------------------------------------------------------------------
   A reference tool, not a magazine.

   The page this replaces was set as a broadsheet: display serif, double rules,
   letterspaced small caps on every label, a standfirst and a dek under each
   heading. It read as decoration around the data rather than a way into it, and
   the prose did most of the talking.

   So: one typeface, four weights, near-black on white, one accent, and rules
   only where a rule separates two things that would otherwise run together.
   Colour is reserved for the map ramps, which encode a value. Nothing else on
   the page is coloured for effect.
   --------------------------------------------------------------------------- */
:root{
  --ink:#16181d; --ink-2:#4c5259; --ink-3:#767d86; --ink-4:#9aa1a9;
  --rule:#d9dde2; --rule-2:#ecEEF1; --bg:#fff; --bg-2:#f6f7f9;
  --accent:#0b4f9c; --accent-bg:#eaf1fa;
  --win:#0f6b3f;
  --hi:#a12a1c; --hi-bg:#fbeae7;
  --md:#8a6112; --md-bg:#fbf1dd;
  --lo:#40607d; --lo-bg:#eaf0f6;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 72px}
b,strong{font-weight:600}
.n,.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* masthead: an identifying bar, not a cover ------------------------------- */
.top{border-bottom:1px solid var(--rule);margin-bottom:26px}
.topin{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;
  align-items:baseline;gap:16px;flex-wrap:wrap}
.topin .name{font-size:15px;font-weight:600;letter-spacing:-.01em;
  text-decoration:none;color:var(--ink)}
.topin .what{font-size:13.5px;color:var(--ink-3)}
.topin nav{margin-left:auto;display:flex;gap:16px}
.topin nav a{font-size:13.5px;color:var(--accent);text-decoration:none}
.topin nav a:hover{text-decoration:underline}

section{margin:0 0 44px}
h2{font-size:19px;font-weight:600;letter-spacing:-.012em;margin:0 0 14px;
  padding-bottom:9px;border-bottom:1px solid var(--rule)}
h2 .c{float:right;font-size:13px;font-weight:400;color:var(--ink-3);
  padding-top:4px}

/* controls ---------------------------------------------------------------- */
.controls{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;
  margin:0 0 14px}
.grp{display:flex;align-items:center;gap:8px}
.lbl{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);
  border-radius:5px;overflow:hidden;background:var(--bg)}
.seg button{font:inherit;font-size:13px;padding:5px 11px;border:0;
  border-right:1px solid var(--rule);background:var(--bg);color:var(--ink-2);
  cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--bg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.linkish{font:inherit;font-size:13px;background:none;border:0;padding:0;
  color:var(--accent);cursor:pointer;text-decoration:underline}

/* THE YEAR RAIL.
   Twenty-seven years poured into one wrapping row broke wherever the window
   happened to run out: 2000-2017 on the first line and 2018-2026 on the second,
   so 2020 sat directly under 2002 and the two eras interleaved down the column.
   Worse, the break moved with the window, so the year you were on moved too.
   Split by decade the rows are fixed. A year is always in the row its decade
   names, a year is always in the same column as the years that end in the same
   digit, and nothing moves when the window resizes. */
/* min-width:auto is a flex item's default and it refuses to shrink below its
   content, so the rail stayed 429px wide inside a 390px phone: its overflow-x
   never engaged, the page grew sideways instead, and 2007-2009 and 2017-2019
   could not be reached at all. Both links in the chain have to yield. */
.grp.years{align-items:flex-start;min-width:0;max-width:100%}
.grp.years>.lbl,.grp.years>.linkish{padding-top:6px}
#segYear.rail{display:flex;flex-direction:column;align-items:flex-start;
  gap:5px;border:0;border-radius:0;background:none;max-width:100%;min-width:0;
  /* One scroller for the whole rail, not one per row: three separate scrollers
     would let the decades slide out of step and lose the column alignment that
     is the point of the layout. */
  overflow-x:auto}
.rail .dec{display:flex;align-items:center;gap:9px}
.rail .dl{font-size:11.5px;color:var(--ink-3);width:34px;flex:none;
  text-align:right;font-variant-numeric:tabular-nums}
/* The decade label does NOT stick when the rail scrolls. Pinned, the years slid
   half under it and printed "2000s004" -- a label and a year reading as one
   broken token. The years name their own decade well enough. */
.rail .seg{border:1px solid var(--rule);border-radius:5px;overflow:hidden;
  /* A decade never breaks across lines. Letting it wrap would orphan 2009 on a
     row of its own and bring back, in miniature, the ragged break this layout
     exists to remove. */
  flex-wrap:nowrap}
/* Every year gets the same cell, so 2005, 2015 and 2025 line up. */
.rail .seg button{min-width:54px;text-align:center}
/* Narrow enough that ten full-width cells will not fit, the cells tighten
   before the rail resorts to scrolling. */
@media (max-width:980px){
  .rail .seg button{min-width:0;padding:5px 7px}
  .rail .dl{width:30px}
}
/* The decade that straddles the eras is one row with a seam in it. Turnout
   begins in 2021 and the corpus either side of that line is a different animal;
   the rule says where they meet, and the notice above the map says what
   changes, once, when you cross it. */
.rail .seg button.era{border-left:2px solid var(--ink-4)}
.cv{display:inline-block;margin-right:5px;font-size:12px;line-height:1;
  transition:transform .12s ease}
#preToggle[aria-expanded="true"] .cv{transform:rotate(90deg)}
.findbox{position:relative;flex:1;min-width:230px;max-width:340px}
#q{width:100%;font:inherit;font-size:13.5px;padding:6px 31px 6px 10px;
  border:1px solid var(--rule);border-radius:5px;background:var(--bg)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
/* The browser's own clear button lands exactly where the caret goes. */
#q::-webkit-search-cancel-button{display:none}
.qall{position:absolute;right:1px;top:1px;bottom:1px;width:28px;border:0;
  background:none;color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;
  border-radius:0 4px 4px 0;border-left:1px solid var(--rule)}
.qall:hover{background:var(--bg-2);color:var(--ink)}
#q[aria-expanded="true"]~.qall{color:var(--accent)}
.hits{position:absolute;z-index:40;left:0;right:0;top:100%;margin-top:3px;
  background:var(--bg);border:1px solid var(--rule);border-radius:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.1);max-height:290px;overflow:auto}
.hits:empty{display:none}
.hits button{display:flex;justify-content:space-between;gap:12px;width:100%;
  font:inherit;font-size:13.5px;text-align:left;padding:7px 10px;border:0;
  background:none;cursor:pointer;border-bottom:1px solid var(--rule-2)}
.hits button:hover{background:var(--accent-bg)}
.hits button span:last-child{color:var(--ink-3);font-size:12.5px;white-space:nowrap}

/* the era notice: said once, not on every element ------------------------- */
.notice{border:1px solid var(--rule);border-left:3px solid var(--md);
  background:var(--bg-2);border-radius:4px;padding:11px 14px;margin:0 0 14px;
  font-size:13.5px;color:var(--ink-2);max-width:96ch}
.notice b{color:var(--ink)}
.notice[hidden]{display:none}

/* map --------------------------------------------------------------------- */
.mapbox{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:26px;
  align-items:start}
.plate{position:relative;border:1px solid var(--rule);border-radius:5px;
  background:var(--bg-2);padding:10px}
svg.map{width:100%;height:auto;display:block}
/* STROKES ARE SCREEN-WIDTH, NOT MAP-WIDTH.
   The viewBox is in metres, so a stroke-width of 220 is 220 METRES of ink on
   every side of a polygon. On the mainland that reads as a tidy hairline; on
   Gosnold's islands and the outer Cape it is wider than the land, and the island
   disappears under its own border. `vector-effect:non-scaling-stroke` takes the
   stroke out of the coordinate system so 0.6px is 0.6px at any size. */
svg.map path{stroke:#2a2622;stroke-linejoin:round;cursor:pointer;
  vector-effect:non-scaling-stroke;stroke-width:.6px}
svg.map path:hover{stroke:var(--ink);stroke-width:2px}
svg.map path[data-sel]{stroke:var(--ink);stroke-width:2.6px}
svg.map path.off{stroke:none;cursor:default}
svg.map path.off:hover{stroke:none}
svg.map path.outline{fill:none;stroke:#2a2622;stroke-width:1.1px;
  vector-effect:non-scaling-stroke;pointer-events:none}
svg.map path.flash{stroke:var(--accent);stroke-width:3px}
/* Top left, not bottom left. The Commonwealth is rotated onto its own minimum
   rectangle, so it runs corner to corner and the empty ground is the top-left
   and bottom-right triangles. At the bottom left the box sits on Berkshire
   County. */
.readout{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.95);
  border:1px solid var(--rule);border-radius:4px;padding:7px 10px;font-size:12.5px;
  pointer-events:none;min-width:172px}
.readout b{display:block;font-size:14px;margin-bottom:2px}
.readout .m{display:block;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend h4{margin:0 0 7px;font-size:13px;font-weight:600}
.legend .row{display:flex;align-items:center;gap:7px;font-size:12.5px;
  color:var(--ink-2);margin-bottom:3px}
.legend .sw{width:15px;height:11px;border:1px solid rgba(0,0,0,.16);
  border-radius:2px;flex:none}
.legend p{font-size:12.5px;color:var(--ink-3);margin:9px 0 0;line-height:1.42}
.statewide{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.statewide .k{font-size:12.5px;color:var(--ink-3)}
.statewide .big{font-size:26px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.statewide p{font-size:12.5px;color:var(--ink-2);margin:4px 0 0;line-height:1.44}

/* the election ------------------------------------------------------------ */
.paper .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-bottom:3px}
.paper h3{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0}
.paper .yr{color:var(--ink-3);font-weight:400}
.paper .where{font-size:13px;color:var(--ink-3)}
.paper .lede{font-size:14.5px;color:var(--ink-2);max-width:88ch;margin:7px 0 0}
.paper .lede b{color:var(--ink);font-weight:600}

/* The rules between the facts are drawn ON the cells, not by showing a coloured
   background through 1px gaps. Five facts in a row of four left the last row
   mostly empty, and with the gap trick that emptiness was a grey slab that read
   as a broken layout. Each cell carries its own left and top rule; the ones that
   would fall on the outside edge are clipped by the container, so the grid keeps
   its internal lines and an unfilled cell is simply background. */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:0;background:var(--bg);border:1px solid var(--rule);border-radius:5px;
  overflow:hidden;margin:16px 0 0}
.facts>div{background:var(--bg);padding:10px 12px;min-width:0;
  box-shadow:-1px -1px 0 0 var(--rule)}
.facts .k{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.facts .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;line-height:1.28;overflow-wrap:anywhere}
.facts .nn{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.36}
.facts a{color:var(--accent)}
.facts .src .v{font-size:14.5px;font-weight:600;line-height:1.34}
.facts .doclink{display:inline-block;margin-top:4px;font-size:12.5px}
.facts .withheld{font-size:12px;color:var(--md);margin-top:3px;line-height:1.36}

.cnote{font-size:12.5px;color:var(--ink-3);line-height:1.45;margin:6px 0 0}

/* contests: two columns that FLOW, which is not the same as a two-column grid.
   A grid pairs contests into rows and stretches each pair to the taller of the
   two, so a three-name race sits in a block as tall as an eleven-name one beside
   it. `column-count` fills the left column and then the right, `break-inside`
   keeps a contest whole, and a town with fifteen offices stops running the
   length of the screen. */
.contests{column-count:2;column-gap:38px;margin-top:20px}
.contest{break-inside:avoid-column;border-top:1px solid var(--rule);
  padding:12px 0 4px;margin-bottom:2px}
@media (max-width:820px){.contests{column-count:1}}
.contest h4{margin:0 0 8px;font-size:15.5px;font-weight:600;display:flex;
  justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.contest h4 .meta{font-size:12.5px;font-weight:400;color:var(--ink-3);
  white-space:nowrap}
.contest h4 .scope{font-weight:400;color:var(--ink-2);font-size:13.5px}
.crow{display:grid;grid-template-columns:1fr 82px 62px;gap:10px;
  align-items:baseline;padding:3px 0;border-bottom:1px solid var(--rule-2)}
.crow:last-of-type{border-bottom:0}
.crow .nm{font:inherit;font-size:14.5px;text-align:left;background:none;
  border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;
  text-decoration-color:var(--rule);text-underline-offset:2.5px}
.crow .nm:hover{text-decoration-color:var(--accent);color:var(--accent)}
.crow.won .nm{font-weight:600}
.crow .win{font-size:11px;color:var(--win);margin-left:7px;font-weight:600;
  white-space:nowrap}
.crow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
.crow .p{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;
  color:var(--ink-3)}
.crow.tally{color:var(--ink-3)}
.crow.tally .nm{text-decoration:none;cursor:default;color:var(--ink-3);
  font-size:13.5px}
/* How well a figure is evidenced, shown as an underline on the figure rather
   than as a coloured chip: it qualifies the number without competing with it. */
.crow .v.grounded{border-bottom:1.5px solid var(--win)}
.crow .v.ocr{border-bottom:1.5px dashed var(--md)}
.crow .v.ungrounded,.crow .v.namedonly{border-bottom:1.5px dotted var(--hi)}
.crow .v.sent{color:var(--ink-3);font-style:italic}

.tmm{margin-top:34px;padding-top:16px;border-top:2px solid var(--ink)}
.tmm h3{font-size:16px;font-weight:600;margin:0 0 4px}
.tmm .dek{font-size:13px;color:var(--ink-3);margin:0 0 6px;max-width:88ch}
.tmm details{border-top:1px solid var(--rule-2)}
.tmm summary{cursor:pointer;padding:8px 0;font-size:14px;display:flex;
  justify-content:space-between;gap:14px;align-items:baseline}
.tmm summary::-webkit-details-marker{display:none}
.tmm summary .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tmm summary:hover{color:var(--accent)}
.tmm details[open] summary{font-weight:600}
.tmm .inner{padding:0 0 12px}

/* flags ------------------------------------------------------------------- */
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.flag{font-size:11.5px;padding:1.5px 7px;border-radius:3px;white-space:nowrap}
.flag.high{background:var(--hi-bg);color:var(--hi)}
.flag.medium{background:var(--md-bg);color:var(--md)}
.flag.low,.flag.note{background:var(--bg-2);color:var(--ink-3)}

/* tables ------------------------------------------------------------------ */
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;
  padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 12px 7px 0;border-bottom:1px solid var(--rule-2);
  vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
/* EVERY COLUMN IS SEPARATED FROM THE ONE BEFORE IT, not just the numeric ones.
   Cells had no left padding and right-aligned cells had no right padding, so
   neighbours sat flush: a margin of 1 beside a share of 0.01% printed as
   `10.01%`, and that share beside its winner printed as `0.01%Thomas S Crane`.
   Two figures reading as one wrong number is worse than a crowded table. */
th+th,td+td{padding-left:16px}
td .who{color:var(--ink-3);font-size:13px}
button.town{font:inherit;font-size:14px;background:none;border:0;padding:0;
  color:var(--accent);cursor:pointer;text-decoration:underline;text-align:left}
.tablewrap{overflow-x:auto}

/* drawer: the part that was already right ---------------------------------- */
.scrim{position:fixed;inset:0;background:rgba(18,20,24,.42);opacity:0;
  pointer-events:none;transition:opacity .16s;z-index:60}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);
  background:var(--bg);border-left:1px solid var(--rule);z-index:61;
  transform:translateX(101%);transition:transform .2s ease;
  display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(0,0,0,.13)}
.drawer[data-open="true"]{transform:none}
.drawer .dh{padding:18px 22px 13px;border-bottom:1px solid var(--rule);
  position:relative;flex:none}
.drawer .x{position:absolute;top:12px;right:14px;font-size:23px;line-height:1;
  background:none;border:0;color:var(--ink-3);cursor:pointer;padding:3px 7px}
.drawer .x:hover{color:var(--ink)}
.drawer .kicker{font-size:12.5px;color:var(--ink-3);padding-right:30px}
.drawer h3{margin:3px 0 3px;font-size:21px;font-weight:600;letter-spacing:-.017em;
  padding-right:30px}
.drawer .sub{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.drawer .body{padding:4px 22px 40px;overflow:auto;flex:1}
.dsec{padding:15px 0;border-bottom:1px solid var(--rule-2)}
.dsec:last-child{border-bottom:0}
.dsec h5{margin:0 0 7px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.claim{font-size:15px;margin:0;line-height:1.5}
.fac{border:1px solid var(--rule);border-radius:4px;overflow:hidden;
  background:var(--bg-2)}
.fac .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:5px 9px;background:var(--bg);border-bottom:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-3)}
.fac .fh button{font:inherit;font-size:11.5px;background:none;border:0;
  color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
.fac .cells{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);padding:1px}
.fac .cell{background:var(--bg);padding:5px 8px;font-family:var(--mono);
  font-size:12.5px;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.fac .cell.num{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.fac .raw{padding:8px 9px;font-family:var(--mono);font-size:12.5px;
  overflow-wrap:anywhere;background:var(--bg)}
.fac mark{background:#fdeaa8;padding:0 1px}
.miss{font-size:13.5px;color:var(--ink-2);background:var(--bg-2);
  border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin:0}
.near,.resolved{font-size:13px;color:var(--ink-2);margin:7px 0 0;line-height:1.46}
.resolved{color:var(--win)}
.steps{list-style:none;margin:0;padding:0}
.steps li{padding:7px 0 7px 14px;border-left:2px solid var(--rule);
  margin-bottom:2px}
.steps .l{font-size:11.5px;color:var(--ink-3)}
.steps .t{font-size:13.5px}
.steps a{font-size:12px;color:var(--accent);overflow-wrap:anywhere;
  display:inline-block;margin-top:2px}
.gaps{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.gaps li{margin-bottom:3px}
.qadef{border-left:3px solid var(--rule);padding:5px 0 5px 10px;margin-bottom:8px}
.qadef.high{border-color:var(--hi)} .qadef.medium{border-color:var(--md)}
.qadef b{font-size:13.5px} .qadef p{margin:1px 0 0;font-size:13px;color:var(--ink-2)}
table.conf td.alt{color:var(--md)}
.grounding{display:flex;gap:22px;flex-wrap:wrap}
.grounding div{min-width:96px}
.grounding .k{font-size:12px;color:var(--ink-3)}
.grounding .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-3);max-width:96ch;line-height:1.55}
footer a{color:var(--accent)}
footer code{font-family:var(--mono);font-size:.92em}

@media (max-width:900px){
  .mapbox{grid-template-columns:1fr;gap:18px}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:0 18px;align-items:start}
  .legend h4{grid-column:1/-1}
  .legend p{grid-column:1/-1}
}
@media (max-width:620px){
  .wrap{padding:0 14px 48px}
  .topin{padding:11px 14px;gap:9px}
  .topin .what{display:none}
  body{font-size:14.5px}
  .paper h3{font-size:21px}
  .crow{grid-template-columns:1fr 68px 50px;gap:7px}
  .drawer{width:100%}
  .drawer .body{padding:4px 15px 34px}
  h2 .c{float:none;display:block;padding:3px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="top"><div class="topin">
  <a class="name" href="../">Massachusetts Civic Atlas</a>
  <span class="what">Annual municipal election results</span>
  <nav>
    <a href="../coverage.html">Coverage</a>
    <a href="../">Data</a>
  </nav>
</div></div>

<div class="wrap">

<section id="map">
  <h2>Where the votes were <span class="c" id="mastcount"></span></h2>

  <div class="notice" id="eraNotice" hidden></div>

  <div class="controls">
    <div class="grp years"><span class="lbl">Year</span>
      <div class="seg" id="segYear"></div>
      <button class="linkish" id="preToggle" aria-expanded="false"
              aria-controls="segYear"><span class="cv">&#9656;</span>Earlier years</button></div>
    <div class="grp"><span class="lbl">Shading</span>
      <div class="seg" id="segMetric"></div></div>
    <div class="grp findbox">
      <input type="search" id="q" placeholder="Find a town"
             autocomplete="off" spellcheck="false" aria-label="Find a municipality"
             role="combobox" aria-controls="hits" aria-expanded="false">
      <button class="qall" id="qall" title="Show all 351 municipalities"
              aria-label="Show all 351 municipalities">&#9662;</button>
      <div class="hits" id="hits"></div>
    </div>
  </div>

  <div class="mapbox">
    <div class="plate">
      <svg class="map" id="svg" role="img" aria-label="Map of Massachusetts municipalities"></svg>
      <div class="readout" id="readout"></div>
    </div>

      <div class="legend" id="legend"></div>
      <div class="statewide" id="statewide"></div>
    </div>
  </div>
</section>

<section id="town">
  <h2>The election <span class="c">Every name opens the document behind it</span></h2>
  <div class="paper" id="paper"></div>
</section>

<section id="handful">
  <h2>Decided by a handful</h2>
  <div class="controls">
    <div class="grp"><span class="lbl">Counting candidates over</span>
      <div class="seg" id="segThr"></div></div>
    <div class="grp"><div class="seg" id="segDir"></div></div>
    <div class="grp"><div class="seg" id="segBy"></div></div>
  </div>
  <div class="tablewrap" id="marginTable"></div>
</section>

<footer id="foot"></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Provenance">
  <div class="dh">
    <button class="x" id="dx" aria-label="Close">&times;</button>
    <div class="kicker" id="dkick"></div>
    <h3 id="dname"></h3>
    <div class="sub" id="dsub"></div>
  </div>
  <div class="body" id="dbody"></div>
</aside>

<script src="geo.js"></script>
<script src="mvp-data.js"></script>
<script>
const M = window.MVP, G = window.GEO, S = M.stats;
const $ = s => document.querySelector(s);
const fmt = n => (n == null ? '—' : n.toLocaleString('en-US'));
const pct = (x, d) => x == null ? '—' : (x * 100).toFixed(d === undefined ? 1 : d) + '%';
/* A share that has not reached a number does not get to print it. `pct` rounds,
   which is right for a turnout band and wrong for a claim of completeness: 99.61
   became "100%" and asserted 207 rows that do not exist. This one floors. */
const pctDown = (x, d) => x == null ? '—'
  : (Math.floor(x * 100 * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = (t, y) => t + '|' + y;

let YEAR = '2025', METRIC = 'turnout', TOWN = 'Provincetown',
    DIR = 'close', BY = 'pct', THR = '0.05';

/* =====================================================================
   TWO CORPORA, ONE PAGE.

   `MVP` is 2021-2026, built from documents whose text was pooled line by line,
   so every figure can be shown on the line it was printed on. `MVP_PRE` is
   2000-2020, cut out of annual town reports and read as page images; the
   figures were checked against the page but the lines were never kept.

   They are held apart rather than merged. Everything below reads through REC /
   COV / TMARGIN, which know which era a key belongs to, so no part of the page
   has to remember. The pre-2021 file is 4.5MB and is fetched only if asked for:
   the default view never pays for it.
   ===================================================================== */
const PRE_YEARS = [];
for (let y = 2000; y <= 2020; y++) PRE_YEARS.push(String(y));
let PRE = null, PRE_SHOWN = false;
// The modern year the rail was opened from, so closing it returns there.
let RETURN_YEAR = null;

const isPre = y => y < '2021';
const REC = k => isPre(k.split('|')[1]) ? (PRE && PRE.ty[k]) || null : M.ty[k] || null;
const TMARGIN = k => isPre(k.split('|')[1])
  ? (PRE && PRE.tmargin[k] != null ? PRE.tmargin[k] : null)
  : (M.tmargin[k] != null ? M.tmargin[k] : null);
/* A town with no pre-2021 record was not searched and found wanting: it has not
   been collected yet. Saying `nothing found` there would assert a search that
   never happened, which is the one thing the coverage shading exists to avoid. */
const COV = k => isPre(k.split('|')[1])
  ? (PRE && PRE.ty[k] ? 'official' : 'not_collected')
  : (M.cov[k] || 'no_source');

/* =====================================================================
   town detail, fetched for the town being read
   `M.ty` ships five fields per town-year: enough to shade the map, fill the
   readout and count the search list, and enough to keep `nothing found`,
   `not collected` and `no election` apart. The candidate rows, the source
   lines behind each figure and the provenance chain are ten megabytes across
   351 towns, and they belong to whichever one the reader opened -- so they
   arrive one town at a time.

   A loaded record replaces its index record in `M.ty` in place, so every
   reader downstream goes on saying `M.ty[k]` and none of them needs to know
   this happened. `races` is the tell: an index record has none.
   ===================================================================== */
const SLUG = n => n.replace(/[^A-Za-z0-9]/g, '');
const TOWN_STATE = {}, TOWN_WAIT = {};
const thin = r => !!r && !r.races;
window.MVP_TOWN = function (name, recs) {
  Object.assign(M.ty, recs);
  const s = SLUG(name);
  TOWN_STATE[s] = 'done';
  (TOWN_WAIT[s] || []).forEach(f => f(true));
  delete TOWN_WAIT[s];
};
function needTown(name, then) {
  const s = SLUG(name);
  if (TOWN_STATE[s] === 'done')   { if (then) then(true);  return; }
  // A town whose file will not load is not retried on every hover. It is
  // reported once, where the election would have been.
  if (TOWN_STATE[s] === 'failed') { if (then) then(false); return; }
  if (then) (TOWN_WAIT[s] = TOWN_WAIT[s] || []).push(then);
  if (TOWN_STATE[s] === 'loading') return;
  TOWN_STATE[s] = 'loading';
  fetchTown(s, 1);
}
/* One retry, then give up and say so. A reader moving around the map asks for
   these files one at a time over a whole session, and a single dropped request
   would otherwise leave that town unreadable until the page was reloaded. A
   town that is genuinely not there fails twice and is not asked for again. */
function fetchTown(s, tries) {
  const el = document.createElement('script');
  el.src = 'town/' + s + '.js';
  el.onerror = () => {
    el.remove();
    if (tries > 0) return fetchTown(s, tries - 1);
    TOWN_STATE[s] = 'failed';
    (TOWN_WAIT[s] || []).forEach(f => f(false));
    delete TOWN_WAIT[s];
  };
  document.head.appendChild(el);
}

/* The callback is optional, because opening the rail warms this bundle without
   waiting on it, and one request is shared by everyone who asks while it is in
   flight -- otherwise a warm-up and a click a moment later fetch 4.5 MB twice. */
let PRE_WAIT = null;
function loadPre(then) {
  then = then || function () {};
  if (PRE) return then(true);
  if (PRE_WAIT) { PRE_WAIT.push(then); return; }
  PRE_WAIT = [then];
  const done = ok => {
    const waiting = PRE_WAIT; PRE_WAIT = null;
    waiting.forEach(f => f(ok));
  };
  const s = document.createElement('script');
  s.src = 'mvp-pre2021.js';
  s.onload = () => { PRE = window.MVP_PRE; done(!!PRE); };
  s.onerror = () => done(false);
  document.head.appendChild(s);
}

/* qa/STANDARD.md A3: the votes field carries two reserved negatives. They are
   not counts and are never printed as numbers. */
const isWin = v => v < 0;
const seatsOf = r => r.eseats || r.seats;
const voteCell = (v, nc) => v < 0 ? (v === -3 ? 'write-in' : 'no count')
  : (nc && v === 0) ? 'not published' : fmt(v);

/* =====================================================================
   Scales. Turnout keeps the breaks of the printed map this is modelled on
   (<10 / 10-20 / 20-30 / 30-40 / >40) so the two can be read side by side.
   ===================================================================== */
const RAMP_RED  = ['#43181a','#8f2b25','#d9503c','#ef9d84','#f7d6cb'];
const RAMP_TEAL = ['#0f3b3a','#1f6360','#4b938d','#8fc0b8','#cfe3dd'];
const RAMP_GOLD = ['#4a3410','#8a6112','#c08f2a','#e0bd72','#f2e2bd'];
const NODATA = '#dedad3', NOELECT = '#ffffff', ZERO = '#b9c2c9',
      UNCOLLECTED = '#eeebe6';

const METRICS = {
  turnout: {
    legend: 'Turnout',
    breaks: [.10, .20, .30, .40],
    labels: ['under 10%', '10–20%', '20–30%', '30–40%', 'over 40%'],
    ramp: RAMP_RED,
    val: r => r && r.turnout,
    show: v => v === 0 ? 'no counts published' : pct(v),
    note: 'Ballots cast, over registered voters at the election date.',
    // No registered-voter series was published for the pre-2021 years in this
    // corpus, so there is no denominator and no rate is computed.
    pre: false,
  },
  contested: {
    legend: 'Contested',
    breaks: [.001, .20, .40, .60],
    labels: ['none at all', 'under 20%', '20–40%', '40–60%', 'over 60%'],
    ramp: RAMP_TEAL,
    val: r => r && r.n ? r.contested / r.n : null,
    show: v => pct(v, 0),
    note: 'More candidates clearing 5% of the ballots than there were seats.',
    pre: true,
  },
  margin: {
    legend: 'Closest margin',
    breaks: [.01, .025, .05, .10],
    labels: ['under 1 pt', '1–2.5 pts', '2.5–5 pts', '5–10 pts', 'over 10 pts'],
    ramp: RAMP_GOLD,
    val: (r, k) => TMARGIN(k),
    show: v => v == null ? '—' : (v * 100).toFixed(2) + ' pts',
    note: 'Narrowest gap between the last winner and the runner-up.',
    pre: true,
  },
  coverage: {
    cat: true,
    legend: 'Source',
    cats: [['official', '#3d5c46', 'Town’s own publication'],
           ['news', '#7a5a2c', 'News report only'],
           ['thirdparty', '#5c6f8b', 'Republished by a third party'],
           ['other', '#8b8577', 'Source kind unrecorded'],
           ['no_source', NODATA, 'Searched, nothing found'],
           ['not_collected', UNCOLLECTED, 'Not collected yet'],
           ['no_election', NOELECT, 'No election held']],
    val: (r, k) => r ? (r.kind || 'other') : COV(k),
    show: v => ({official: 'Town’s own publication', news: 'News report only',
                 thirdparty: 'Republished by a third party',
                 other: 'Source kind unrecorded', no_source: 'Nothing found',
                 not_collected: 'Not collected yet',
                 no_election: 'No election held'}[v] || v),
    note: 'A town shaded pale was searched and nothing found.',
    pre: true,
  },
};

/* A shading with no figures for this year is not 351 towns that were each
   searched and came up empty -- it is one absence, the same one everywhere. So
   it shades as one state and the legend names it, rather than falling through
   to per-town coverage and telling a town that HAS a published result that no
   result was found. Whether a town has a result is the Source shading's
   question, and it still answers it. */
const metricBlank = m => isPre(YEAR) && !m.pre;
function colorFor(name) {
  const k = KEY(name, YEAR), r = REC(k), m = METRICS[METRIC];
  if (metricBlank(m))
    return [COV(k) === 'no_election' ? NOELECT : UNCOLLECTED, null];
  const v = m.val(r, k);
  if (m.cat) {
    const c = m.cats.find(c => c[0] === v);
    return [c ? c[1] : NODATA, v];
  }
  if (v == null) {
    const c = COV(k);
    return [c === 'no_election' ? NOELECT
          : c === 'not_collected' ? UNCOLLECTED : NODATA, null];
  }
  // A turnout of exactly zero is never a turnout. It is a town-year whose source
  // named the winners and printed no counts, and shading it as the darkest band
  // would put a measurement where there is only a silence.
  if (METRIC === 'turnout' && v === 0) return [ZERO, 0];
  let i = 0;
  while (i < m.breaks.length && v >= m.breaks[i]) i++;
  return [m.ramp[i], v];
}

/* ---------------- the map ----------------
   GEO is already rotated onto the Commonwealth's minimum-area rectangle
   (build_geo.py), so the only transform left here is the y-flip SVG needs. */
const [X0, Y0, X1, Y1] = G.bbox, FLIP = Y0 + Y1;
const PAD = 4000;

function drawMap() {
  const paths = Object.keys(G.towns).sort().map(name => {
    const t = G.towns[name];
    const d = t.r.map(ring =>
      'M' + ring.map(p => p[0] + ',' + (FLIP - p[1])).join('L') + 'Z').join('');
    const [c] = colorFor(name);
    return '<path d="' + d + '" fill="' + c + '" data-t="' + esc(name) + '"' +
           (name === TOWN ? ' data-sel="true"' : '') + '><title>' + esc(name) +
           '</title></path>';
  }).join('');
  const outline = (G.outline || []).map(ring =>
    'M' + ring.map(p => p[0] + ',' + (FLIP - p[1])).join('L') + 'Z').join('');
  $('#svg').setAttribute('viewBox',
    (X0 - PAD) + ' ' + (Y0 - PAD) + ' ' + (X1 - X0 + 2 * PAD) + ' ' + (Y1 - Y0 + 2 * PAD));
  $('#svg').innerHTML = '<path class="outline" d="' + outline + '"/>' + paths +
    '<path class="outline" d="' + outline + '"/>';
}

function repaint() {
  Object.keys(G.towns).forEach(name => {
    const p = $('#svg path[data-t="' + CSS.escape(name) + '"]');
    if (!p) return;
    p.setAttribute('fill', colorFor(name)[0]);
    p.classList.toggle('off', COV(KEY(name, YEAR)) === 'no_election');
  });
  document.querySelectorAll('#svg path[data-t]').forEach(p =>
    p.toggleAttribute('data-sel', p.dataset.t === TOWN));
  drawLegend();
  drawStatewide();
  showReadout(TOWN);
  drawEraNotice();
}

/* THE NOTICE IS SAID ONCE.
   Rather than marking every pre-2021 figure as provisional, the page says what
   the era is and what it lacks, once, at the top -- and then shows the data
   without hedging every line of it. */
function drawEraNotice() {
  const el = $('#eraNotice');
  if (!isPre(YEAR)) { el.hidden = true; return; }
  const p = PRE && PRE.stats;
  el.hidden = false;
  el.innerHTML = '<b>2000–2020 is much less complete.</b> These years are cut ' +
    'out of annual town reports: ' + (p ? '<b>' + fmt(p.town_years) + '</b> ' +
    'town-years across <b>' + fmt(p.towns_with) + '</b> of the 351 ' +
    'municipalities' : 'a partial set') + ', against near-complete coverage ' +
    'from 2021 on. A town shaded pale has not been collected yet — it was not ' +
    'searched and found wanting. No registered-voter count has been collected ' +
    'for these years yet, so turnout has no denominator and the map shows none ' +
    '— the other shadings work as they do for any year.';
}

function drawStatewide() {
  const w = !isPre(YEAR) && (M.statewide || {})[YEAR];
  if (!w) {
    // The pre-2021 corpus covers too few towns for a statewide rate to mean
    // anything: an average over 208 of 351 is not a statewide average.
    $('#statewide').innerHTML = isPre(YEAR) && PRE
      ? '<div class="k">Collected for ' + YEAR + '</div><div class="big">' +
        fmt(Object.keys(PRE.ty).filter(k => k.endsWith('|' + YEAR)).length) +
        '</div><p>municipalities with a published result this year. Too few ' +
        'for a statewide figure, so none is given.</p>'
      : '';
    return;
  }
  $('#statewide').innerHTML =
    '<div class="k">Turnout, all of ' + YEAR + '</div>' +
    '<div class="big">' + pct(w.ballots / w.registered) + '</div>' +
    '<p><b>' + fmt(w.ballots) + '</b> ballots cast against <b>' + fmt(w.registered) +
    '</b> registered voters, across the ' + fmt(w.towns) + ' municipalities with a ' +
    'published result. ' + (w.held > w.towns
      ? fmt(w.held - w.towns) + ' more held an election and published nothing; they are ' +
        'in neither figure.'
      : 'Every municipality that held one published a result.') + '</p>' +
    '<div class="k" style="margin-top:12px">The average town</div>' +
    '<div class="big">' + pct(w.mean) + '</div>' +
    '<p>Mean turnout with each municipality counted once, not each voter. Median ' +
    '<b>' + pct(w.median) + '</b>.</p>';
}

function drawLegend() {
  const m = METRICS[METRIC];
  const rows = metricBlank(m)
    ? [[UNCOLLECTED, 'Not available for ' + YEAR], [NOELECT, 'No election held']]
    : m.cat
    ? m.cats.map(c => [c[1], c[2]])
    : m.ramp.map((c, i) => [c, m.labels[i]])
        .concat(METRIC === 'turnout' ? [[ZERO, 'No counts published']] : [])
        .concat(isPre(YEAR) ? [[UNCOLLECTED, 'Not collected yet']]
                            : [[NODATA, 'No result found']])
        .concat([[NOELECT, 'No election held']]);
  /* A shading with no figures for this year says so here, in its own legend,
     rather than being taken off the control. `pre` marks the ones that have no
     data before 2021 -- today that is turnout alone, and only because the
     registered-voter series for those years has not been collected yet. */
  const empty = metricBlank(m);
  $('#legend').innerHTML = '<h4>' + esc(m.legend) + '</h4>' +
    rows.map(([c, l]) => '<div class="row"><span class="sw" style="background:' + c +
      '"></span>' + esc(l) + '</div>').join('') +
    '<p>' + esc(m.note) + '</p>' +
    (empty ? '<p><b>Not available for ' + YEAR + '.</b> No registered-voter ' +
      'counts were published for the years before 2021, so there is no ' +
      'denominator to divide by. Collecting them is work in progress.</p>' : '');
}

function showReadout(name) {
  const k = KEY(name, YEAR), r = REC(k), m = METRICS[METRIC];
  const v = m.val(r, k);
  const co = (M.towns[name] || {}).co;
  const cov = COV(k);
  $('#readout').innerHTML = '<b>' + esc(name) + '</b>' +
    '<span class="m">' + esc(m.legend) + ': ' +
    (v != null ? esc(m.show(v))
       // Distinct absences, said apart. A figure this year cannot carry, a town
       // that held no election, a town not yet collected, a town searched and
       // found wanting -- and a town with a published result whose figure for
       // THIS measure was never printed, which is not the same as no result.
       : metricBlank(m) ? 'not published for ' + YEAR
       : cov === 'no_election' ? 'no election held'
       : cov === 'not_collected' ? 'not collected yet'
       : r ? 'not published' : 'no result found') + '</span>' +
    (r ? '<span class="m">' + r.n + ' contest' + (r.n === 1 ? '' : 's') +
         (r.peak ? ' · ' + fmt(r.peak) + ' ballots' : '') + '</span>' : '') +
    '<span class="m" style="color:var(--ink-3)">' + esc(co || '') + ' County</span>';
}

/* Hovering is the reader saying which town they are about to open. Starting the
   fetch there means the detail is usually already in hand by the time the click
   lands, and the panel fills without a pause. It costs one file for a town the
   reader was pointing at anyway. */
$('#svg').addEventListener('mousemove', e => {
  const p = e.target.closest('path'); if (!p) return;
  showReadout(p.dataset.t);
  if (!isPre(YEAR) && thin(REC(KEY(p.dataset.t, YEAR)))) needTown(p.dataset.t);
});
$('#svg').addEventListener('mouseleave', () => showReadout(TOWN));
$('#svg').addEventListener('click', e => {
  const p = e.target.closest('path'); if (!p) return;
  TOWN = p.dataset.t; repaint(); drawTown();
  $('#town').scrollIntoView({block: 'start'});
});

/* ---------------- segmented controls ---------------- */
function seg(el, items, cur, cb) {
  el.innerHTML = items.map(([v, l]) =>
    '<button data-v="' + v + '" aria-pressed="' + (v === cur) + '">' + l + '</button>').join('');
  bindSeg(el, cb);
}
/* Buttons are found by query rather than by walking `children`, because the
   year rail nests them a row deep and the metric control does not. */
function bindSeg(el, cb) {
  el.onclick = e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    el.querySelectorAll('button[data-v]')
      .forEach(x => x.setAttribute('aria-pressed', x === b));
    cb(b.dataset.v);
  };
}

function yearItems() {
  const modern = M.years.map(y => [y, y]);
  return PRE_SHOWN ? PRE_YEARS.map(y => [y, y]).concat(modern) : modern;
}
/* The earlier years are a separate 4.5 MB bundle, and it is fetched on the first
   year that actually needs it -- not when the rail opens. Opening the rail is a
   glance at what exists, and a glance should not cost four and a half megabytes
   before it will draw anything. */
function setYear(v) {
  if (isPre(v) && !PRE) {
    YEAR = v; drawYearSeg();
    const el = $('#eraNotice');
    el.hidden = false;
    el.innerHTML = '<b>Fetching ' + v + '.</b> The years before 2021 are a ' +
      'separate set, loaded the first time one of them is opened.';
    loadPre(ok => {
      if (YEAR !== v) return;
      // Nothing to show and no pretending otherwise: go back where we were.
      if (!ok) {
        el.innerHTML = '<b>The earlier years could not be loaded.</b> ' +
          'Showing ' + (RETURN_YEAR || M.years[M.years.length - 1]) + ' instead.';
        return applyYear(RETURN_YEAR || M.years[M.years.length - 1], true);
      }
      applyYear(v);
    });
    return;
  }
  applyYear(v);
}
function applyYear(v, keepNotice) {
  YEAR = v;
  /* THE SHADING IS THE READER'S, AND THE PAGE DOES NOT TOUCH IT.
     Turnout has no denominator before 2021 yet, and this used to drop the
     control and switch the map to Contested on its own. Changing a year is not
     asking for a different question to be answered: it moved the ground under
     anyone stepping back one year, and stepping forward again did not undo it.
     The map now shades what it was asked to shade and says where the figures
     run out -- the legend has a band for it and the notice above the map gives
     the reason. Registered-voter counts for the earlier years are being
     collected; when they land, this view fills in and nothing here changes. */
  seg($('#segMetric'), metricItems(), METRIC, setMetric);
  drawYearSeg();
  // repaint() redraws the era notice from the year. When we are here to report
  // that the earlier years would not load, that message has to survive it.
  const keep = keepNotice ? $('#eraNotice').innerHTML : null;
  repaint(); drawTown();
  if (keep !== null) { $('#eraNotice').innerHTML = keep; $('#eraNotice').hidden = false; }
}
function metricItems() {
  // Every shading stays on offer in every year. One of them having no figures
  // yet is something the map says, not something the control hides.
  return Object.keys(METRICS).map(k => [k, METRICS[k].legend]);
}
function setMetric(v) { METRIC = v; repaint(); }
/* Collapsed, the control is what it always was: one row of the years the corpus
   covers properly. Expanded, it becomes a rail of decades -- so the six years
   you were choosing between stay where they are, on the bottom row, and the
   earlier ones appear above them rather than shuffling them along. */
function drawYearSeg() {
  const el = $('#segYear');
  if (!PRE_SHOWN) {
    el.classList.remove('rail');
    seg(el, yearItems(), YEAR, setYear);
    return;
  }
  const all = yearItems().map(([v]) => v);
  const firstModern = M.years[0];
  const decades = [...new Set(all.map(y => y.slice(0, 3)))];
  el.classList.add('rail');
  el.innerHTML = decades.map(d =>
    '<div class="dec"><span class="dl">' + d + '0s</span><div class="seg">' +
    all.filter(y => y.slice(0, 3) === d).map(y =>
      '<button data-v="' + y + '"' + (y === firstModern ? ' class="era"' : '') +
      ' aria-pressed="' + (y === YEAR) + '">' + y + '</button>').join('') +
    '</div></div>').join('');
  bindSeg(el, setYear);
}

drawYearSeg();
seg($('#segMetric'), metricItems(), METRIC, setMetric);

/* The label does not change length as it changes state. It used to read
   "Earlier years", then "Hide earlier years", and the extra word was enough to
   push the button onto a second line and shift the control under it. The caret
   turns instead, and `aria-expanded` carries the state for anyone not looking
   at the caret. */
function preLabel(btn, text) {
  btn.innerHTML = '<span class="cv">&#9656;</span>' + text;
}
$('#preToggle').onclick = function () {
  const btn = this;
  if (PRE_SHOWN) {
    PRE_SHOWN = false; preLabel(btn, 'Earlier years');
    btn.setAttribute('aria-expanded', 'false');
    // Put the reader back on the year they opened the rail from, rather than on
    // whichever year happens to be last. Opening the earlier years to glance at
    // 2014 and closing them again should return you to 2025, not to 2026.
    if (isPre(YEAR)) { YEAR = RETURN_YEAR || M.years[M.years.length - 1]; }
    setYear(YEAR);
    return;
  }
  /* OPENING THE RAIL IS NOT GOING ANYWHERE.
     It used to fetch 4.5 MB, then land the reader on 2020 and swap the shading
     off turnout, because turnout does not exist before 2021. So asking what
     earlier years there are took a wait, moved you off the year you were
     reading and changed what the map was showing you -- three things nobody
     asked for. Now the rows simply appear: same year, same shading, no fetch.
     The bundle is warmed in the background so the first earlier year the reader
     actually picks is already there. */
  RETURN_YEAR = isPre(YEAR) ? RETURN_YEAR : YEAR;
  PRE_SHOWN = true;
  btn.setAttribute('aria-expanded', 'true');
  drawYearSeg();
  loadPre();
};

/* ---------------- search ---------------- */
const NAMES = Object.keys(M.towns).sort();
function searchHits(q) {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  // Prefix first, then anywhere: typing "field" should still reach Springfield.
  const pre = NAMES.filter(n => n.toLowerCase().startsWith(s));
  const mid = NAMES.filter(n => !n.toLowerCase().startsWith(s) && n.toLowerCase().includes(s));
  return pre.concat(mid).slice(0, 12);
}
/* THE LIST IS ALSO A LIST.
   Searching only helps a reader who can already spell what they are after.
   Somebody who half-remembers a town, or who wants to see which 351 there are,
   had nothing to open. The caret shows all of them, typing narrows them, and
   both arrive in the same panel so there is only ever one thing on screen. */
function drawHits(names) {
  $('#hits').innerHTML = names.map(n => {
    const k = KEY(n, YEAR), r = REC(k), c = COV(k);
    return '<button data-t="' + esc(n) + '"><span>' + esc(n) + '</span><span>' +
      (r ? r.n + ' contests' : c === 'no_election' ? 'no election'
         : c === 'not_collected' ? 'not collected' : 'no result') + '</span></button>';
  }).join('');
  $('#q').setAttribute('aria-expanded', names.length ? 'true' : 'false');
}
function closeHits() { drawHits([]); }
function openAll() {
  drawHits(NAMES);
  // Scroll the town being read into view in the list, so opening it says where
  // you are as well as what there is.
  const cur = $('#hits button[data-t="' + CSS.escape(TOWN) + '"]');
  if (cur) cur.scrollIntoView({block: 'center'});
}
$('#q').addEventListener('input', e => {
  const v = e.target.value;
  drawHits(v.trim() ? searchHits(v) : []);
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeHits(); return; }
  if (e.key === 'ArrowDown' && !$('#hits').innerHTML) { openAll(); return; }
  if (e.key !== 'Enter') return;
  const hit = searchHits(e.target.value)[0];
  if (hit) { goTown(hit); e.target.value = ''; closeHits(); }
});
$('#qall').addEventListener('click', () => {
  if ($('#hits').innerHTML) { closeHits(); return; }
  $('#q').value = ''; openAll(); $('#q').focus();
});
$('#hits').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  goTown(b.dataset.t); $('#q').value = ''; closeHits();
});
// A list opened without typing needs a way to be dismissed without choosing.
document.addEventListener('click', e => {
  if (!e.target.closest('.findbox')) closeHits();
});
/* Pointing at a name in the list is the same signal as pointing at the town on
   the map: start its file so the click has nothing left to wait for. */
$('#hits').addEventListener('mouseover', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (!isPre(YEAR) && thin(REC(KEY(b.dataset.t, YEAR)))) needTown(b.dataset.t);
});
function goTown(name) {
  TOWN = name; repaint(); drawTown(); showReadout(name);
  const p = $('#svg path[data-t="' + CSS.escape(name) + '"]');
  if (p) { p.classList.add('flash'); setTimeout(() => p.classList.remove('flash'), 1200); }
  $('#town').scrollIntoView({block: 'start'});
}

/* =====================================================================
   The election
   ===================================================================== */
function winners(r) {
  const s = seatsOf(r);
  return new Set(r.cands.filter((c, i) => isWin(c[1]) || (i < s && c[1] > 0)).map(c => c[0]));
}

function longDate(d) {
  if (!d) return 'an unrecorded date';
  const [y, m, dd] = d.split('-').map(Number);
  return ['January','February','March','April','May','June','July','August',
          'September','October','November','December'][m - 1] + ' ' + dd + ', ' + y;
}

function flagChips(codes, minSev) {
  // Low-severity flags are near-universal (a term length is missing from most
  // office strings in the corpus) and drown the page. They are not hidden: they
  // are listed in full in the provenance drawer.
  const rank = {high: 0, medium: 1, low: 2, note: 3};
  const keep = (codes || []).filter(c => M.qadefs[c] &&
    rank[M.qadefs[c].sev] <= (minSev === undefined ? 1 : minSev));
  if (!keep.length) return '';
  return '<div class="flags">' + keep.map(c => {
    const q = M.qadefs[c]; if (!q) return '';
    return '<span class="flag ' + q.sev + '" title="' + esc(q.why) + '">' + esc(q.lab) + '</span>';
  }).join('') + '</div>';
}

function ledeFor(name, r) {
  if (!r) {
    const st = COV(KEY(name, YEAR));
    return st === 'no_election'
      ? 'No municipal election was held in ' + name + ' in ' + YEAR + '.'
      : st === 'not_collected'
      ? 'The ' + YEAR + ' election in ' + name + ' has not been collected yet. ' +
        'That is a gap in this collection, not a statement about the town.'
      : 'No published result has been found for ' + name + ' in ' + YEAR + '. ' +
        'The absence is recorded rather than asserted — the town was searched, ' +
        'and nothing was located.';
  }
  const bits = [];
  if (r.peak)
    bits.push('<b>' + fmt(r.peak) + '</b> ballots across <b>' + r.n + '</b> contest' +
              (r.n === 1 ? '' : 's') + ' on ' + longDate(r.date) + '.');
  else
    bits.push('<b>' + r.n + '</b> contest' + (r.n === 1 ? '' : 's') + ' on ' +
              longDate(r.date) + '. ' + ({
      floor: '<b>The officers were elected on the floor of Town Meeting</b>, so no ' +
             'ballots were cast and there is no turnout to report.',
      preballot: '<b>No counts were published</b>: the record here comes from the ' +
                 'town’s sample ballot, which names who stood and cannot say ' +
                 'who won or how many voted.',
      nocounts: '<b>No counts were published</b> — the source named who was ' +
                'elected and printed no numbers.',
    }[r.nocount_why] || '<b>No counts were published.</b>'));
  if (r.turnout && !r.nocount)
    bits.push('<b>' + pct(r.turnout) + '</b> of ' + fmt(r.reg) + ' registered.');
  const unc = r.n - r.contested;
  if (unc === r.n) bits.push('<b>Not one offered a choice.</b>');
  else if (unc) bits.push('<b>' + unc + '</b> offered no choice.');
  const closest = TMARGIN(KEY(name, YEAR));
  if (closest != null)
    bits.push('Closest margin: ' + (closest * 100).toFixed(2) + ' points.');
  return bits.join(' ');
}

/* TOWN MEETING MEMBER IS NOT AN OFFICE LIKE THE OTHERS.
   A representative-town-meeting town elects them by precinct, dozens at a time:
   Framingham 2021 runs to 18 precinct contests and several hundred names, which
   in one flat list buries the select board under them. They are moved below and
   collapsed by precinct -- present and complete, but no longer the bulk of the
   page. */
const TMM_RX = /town\s*meeting\s*member/i;
const isTMM = race => TMM_RX.test(race.office) || TMM_RX.test(race.raw || '');

function contestBlock(race, ri, r) {
  const won = winners(race);
  const rows = race.cands.map(c => {
    const isw = won.has(c[0]);
    const share = race.cast && c[1] > 0 ? c[1] / race.cast : null;
    return '<div class="crow' + (isw ? ' won' : '') + '">' +
      '<button class="nm" data-r="' + ri + '" data-c="' + esc(c[0]) + '">' + esc(c[0]) +
      // The space is in the text, not only in the CSS: without it the button reads
      // as "John T. Goldenelected" to a screen reader and to anyone copying it.
      (isw ? ' <span class="win">elected</span>' : '') + '</button>' +
      '<span class="v' + (c[1] < 0 ? ' sent' : c[3] === 1 ? ' grounded'
                          : c[3] === 2 ? ' ocr'
                          : c[3] === 3 ? ' namedonly'
                          : c[3] === 0 ? ' ungrounded' : '') + '" title="' +
        (c[3] === 1 ? 'This figure is printed on the source line'
         : c[3] === 2 ? 'The source prints ' + (c[6] || '') + ' — the same figure '
           + 'with one character the scanner misread'
         : c[3] === 3 ? 'The document names this candidate and prints no '
           + 'figure beside them'
         : c[3] === 0 ? 'The name is on the source line; this figure is not' : '') +
        '">' + (c[5] != null ? esc(String(c[5])) : voteCell(c[1], race.nocounts)) + '</span>' +
      '<span class="p">' + (share == null ? '' : pct(share, 1)) + '</span></div>';
  }).join('');
  const tally = race.extras.map(e =>
    '<div class="crow tally"><span class="nm">' + esc(e[0]) + '</span>' +
    '<span class="v">' + fmt(e[1]) + '</span><span class="p">' +
    (race.cast ? pct(e[1] / race.cast, 1) : '') + '</span></div>').join('');
  const sN = seatsOf(race);
  const seatnote = sN + ' seat' + (sN === 1 ? '' : 's') +
    (race.term ? ' · ' + race.term + '-year term' : '');
  const notes = [];
  if (race.cast) notes.push(fmt(race.cast) + ' votes counted');
  if (race.eseats)
    notes.push('seats from the arithmetic: ' + fmt(race.cast) + ' = ' + race.eseats +
               ' × ' + fmt(r.peak) + ' ballots, against ' + race.seats + ' on the record');
  if (race.short != null)
    notes.push('only ' + Math.round(race.short * 100) + '% of the ' + sN + ' × ' +
               fmt(r.peak) + ' marks this contest should hold');
  if (!race.cands.length) notes.push('no candidate stood');
  else if (race.cands.length <= sN) notes.push('no more candidates than seats');
  // The precinct or ward, where the office string carried one. Two contests
  // called `Town Meeting Member` in the same town are only distinguishable by it.
  const scope = race.scope ? ' <span class="scope">' + esc(race.scope) + '</span>' : '';
  return '<div class="contest"><h4><span>' + esc(race.office) + scope +
    '</span><span class="meta">' + seatnote + '</span></h4>' + rows + tally +
    (notes.length ? '<div class="cnote">' + notes.join(' · ') + '</div>' : '') +
    flagChips(race.qa) + '</div>';
}

function sourceBox(r) {
  /* THE SOURCE BOX CARRIES THE LINK.
     Naming the publisher and then making the reader search for the document is
     most of the way to citing nothing. Where a URL is held it is offered here,
     next to the name, as well as inside the provenance drawer -- the drawer is
     for one figure, this is for the document as a whole. */
  const who = r.pub || (r.kind === 'official' ? 'The municipality'
                      : r.kind === 'news' ? 'A news outlet' : 'Not recorded');
  const kind = ({official: 'official', news: 'news report',
                 thirdparty: 'republished'}[r.kind] || 'unclassified') +
               (r.era === 'pre2021' ? '' : ' · ' + (r.has_src ? 'text kept' : 'no text'));
  let link = '';
  if (r.url) {
    let host = r.url;
    try { host = new URL(r.url).hostname.replace(/^www\./, ''); } catch (e) {}
    link = '<a class="doclink" href="' + esc(r.url) + '" target="_blank" ' +
      'rel="noopener">Open the source document ↗</a>' +
      '<div class="nn" style="overflow-wrap:anywhere">' + esc(host) + '</div>';
  } else if (r.url_withheld) {
    link = '<div class="withheld">' + esc(r.url_withheld) + '</div>';
  } else {
    link = '<div class="nn">No link to the document was recorded.</div>';
  }
  return '<div class="src"><div class="k">Source</div><div class="v">' + esc(who) +
    '</div><div class="nn">' + esc(kind) + '</div>' + link + '</div>';
}

function drawTown() {
  const name = TOWN, k = KEY(name, YEAR), r = REC(k);
  const meta = M.towns[name] || {};
  const head = '<div class="th"><h3>' + esc(name) + ' <span class="yr">' + YEAR +
          '</span></h3><span class="where">' + esc(meta.co || '') + ' County' +
          (meta.form ? ' · ' + esc(meta.form) : '') + '</span></div>';

  /* The record is an index row until this town's detail arrives. Name the town
     and say what is happening, rather than blanking the panel or showing a
     lede built from figures that are not here yet. Redraw on arrival only if
     the reader has not moved on in the meantime. */
  if (thin(r)) {
    needTown(name, ok => {
      if (TOWN !== name) return;
      if (ok) drawTown();
      else $('#paper').innerHTML = head + '<p class="lede">The return for ' +
        esc(name) + ' could not be loaded. The record exists; the file behind ' +
        'it did not answer. Reloading the page is the first thing to try.</p>';
    });
    return void ($('#paper').innerHTML = head +
      '<p class="lede">Opening the return…</p>');
  }

  let h = head + '<p class="lede">' + ledeFor(name, r) + '</p>';

  if (!r) { $('#paper').innerHTML = h; return; }

  h += '<div class="facts">' + [
    ['Ballots cast', r.peak ? fmt(r.peak) : '—',
     r.peak_from_doc ? 'stated by the document'
       : r.era === 'pre2021' ? 'busiest contest; no total was printed'
       : r.peak ? 'busiest contest' : 'none published'],
    ['Turnout', r.era === 'pre2021' ? 'n/a'
       : r.nocount ? 'n/a' : r.turnout == null ? '—' : pct(r.turnout),
     r.era === 'pre2021' ? 'no registered-voter count for these years'
       : r.nocount ? ({floor: 'no ballot was cast', preballot: 'sample ballot only'}
                      [r.nocount_why] || 'no counts published')
       : r.reg ? 'of ' + fmt(r.reg) + ' registered' : 'no denominator'],
    ['Contests', String(r.n), r.contested + ' contested'],
    ['Seats filled', String(r.seats), ''],
  ].map(([a, b, c]) => '<div><div class="k">' + a + '</div><div class="v">' + b +
       '</div><div class="nn">' + c + '</div></div>').join('') +
    sourceBox(r) + '</div>';

  if (r.printed) {
    const p = r.printed, say = [];
    if (p.cast) say.push(fmt(p.cast) + ' ballots cast');
    if (p.reg) say.push(fmt(p.reg) + ' registered');
    if (p.turnout) say.push(p.turnout.toFixed(2) + '% turnout');
    h += '<p class="cnote">The document states its own figures — ' + say.join(', ') +
         ' — which is an independent check on the two numbers above.</p>';
  }
  if (r.bridge && r.bridge.length)
    h += '<p class="cnote">Reading this document raised: ' +
         r.bridge.map(esc).join('; ') + '.</p>';

  h += flagChips(r.qa);

  const main = [], tmm = [];
  r.races.forEach((race, ri) => (isTMM(race) ? tmm : main).push([race, ri]));

  h += '<div class="contests">' +
    main.map(([race, ri]) => contestBlock(race, ri, r)).join('') + '</div>';

  if (tmm.length) {
    const seats = tmm.reduce((a, [x]) => a + seatsOf(x), 0);
    const names = tmm.reduce((a, [x]) => a + x.cands.length, 0);
    h += '<div class="tmm"><h3>Town meeting members</h3>' +
      '<p class="dek">Elected by precinct, ' + fmt(seats) + ' seat' +
      (seats === 1 ? '' : 's') + ' across ' + tmm.length + ' contest' +
      (tmm.length === 1 ? '' : 's') + ', ' + fmt(names) + ' name' +
      (names === 1 ? '' : 's') + '. Separated from the offices above because ' +
      'there are enough of them to bury everything else. Each opens in full.</p>' +
      tmm.map(([race, ri]) => {
        const w = winners(race);
        return '<details><summary><span>' + esc(race.office) +
          (race.scope ? ' — ' + esc(race.scope) : '') + '</span>' +
          '<span class="meta">' + seatsOf(race) + ' seats · ' +
          race.cands.length + ' stood</span></summary>' +
          '<div class="inner">' + contestBlock(race, ri, r) + '</div></details>';
      }).join('') + '</div>';
  }

  $('#paper').innerHTML = h;
  $('#paper').querySelectorAll('.crow .nm[data-c]').forEach(b =>
    b.onclick = () => openProv(name, YEAR, +b.dataset.r, b.dataset.c));
}

/* =====================================================================
   Provenance drawer — the point of the whole exercise
   ===================================================================== */

/* The converters routinely lose the spaces: `400MatthewRichardGunn-Elected`.
   Respacing is a display aid and is labelled as one; the exact converted text is
   always one click away. */
function respace(s) {
  return s
    .replace(/([0-9])([A-Za-z])/g, '$1 $2')
    .replace(/([A-Za-z])([0-9])/g, '$1 $2')
    .replace(/([a-z.])([A-Z])/g, '$1 $2')
    .replace(/\s*-\s*(Elected|Re-?elected|Write)/gi, ' — $1')
    .replace(/\s+/g, ' ').trim();
}

function highlight(text, name) {
  const parts = name.split(/\s+/).filter(w => w.replace(/\W/g, '').length > 2);
  let out = esc(text);
  const tryOne = w => {
    const rx = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    if (rx.test(out)) { out = out.replace(rx, '<mark>$1</mark>'); return true; }
    return false;
  };
  if (!tryOne(esc(name))) parts.forEach(tryOne);
  return out;
}

function facsimile(cells, name) {
  let raw = cells.join(' | ');
  const body = cells.map(c => {
    const isNum = /^[\d,]+$/.test(c);
    return '<div class="cell' + (isNum ? ' num' : '') + '">' +
      highlight(respace(c), name) + '</div>';
  }).join('');
  return '<div class="fac"><div class="fh"><span>As printed in the source document ' +
    '(spacing reconstructed)</span><button data-raw="1">exact text</button></div>' +
    '<div class="cells">' + body + '</div>' +
    '<div class="raw" hidden>' + esc(raw) + '</div></div>';
}

function openProv(name, year, ri, cname) {
  const r = REC(KEY(name, year)), race = r.races[ri];
  const c = race.cands.find(x => x[0] === cname);
  const won = winners(race).has(cname);

  $('#dkick').textContent = name + ' ' + year + ' · ' + race.office +
    (race.scope ? ' — ' + race.scope : '');
  $('#dname').textContent = cname;
  const share2 = race.cast && c[1] > 0 ? c[1] / race.cast : null;
  $('#dsub').textContent = (won ? 'Elected. ' : '') +
    (c[5] != null ? 'Vote value: ' + c[5]
                  : c[1] < 0 ? 'No vote count published' : fmt(c[1]) + ' votes') +
    (share2 == null ? '' : ' · ' + pct(share2, 1) + ' of ballots cast') +
    ' · ' + longDate(race.date);

  const grounded = c[3] === 2
      ? 'The source prints <b>' + esc(String(c[6] || '')) + '</b> where the record '
        + 'says <b>' + fmt(c[1]) + '</b> — the same figure with one character '
        + 'the scanner misread. Shown rather than corrected.'
    : c[3] === 1 && c[4] === c[2]
      ? 'The vote total is printed on that line too.'
    : c[3] === 1 ? 'The vote total is printed under the name, in a document laid '
      + 'out one value to a line.'
    : c[3] === 3 ? 'The document <b>names this candidate and prints no figure '
      + 'for them</b>. The return lists this contest’s write-ins as bare '
      + 'names and stops — there is no tally on the page to show, for '
      + 'anyone in the list. That is what the clerk printed, not a figure this '
      + 'page failed to find.'
    : c[3] === 0 ? 'The name is on that line. <b>The figure is not</b> — the '
      + 'total came from the parse, and this page cannot show it to you in the source.'
    : '';
  const nearName = c[7]
    ? '<p class="near">Located by name with <b>one letter different</b>: the record '
      + 'says <b>' + esc(c[0]) + '</b>, the document reads <b>' + esc(String(c[7]))
      + '</b>. Shown rather than corrected — the difference may be a typo in '
      + 'the record or a character the scanner misread, and nothing here can tell '
      + 'which.</p>'
    : '';
  const splitNote = c[8]
    ? '<p class="near">This total is the <b>sum of two printed rows</b>: '
      + '<b>' + fmt(c[8][0]) + '</b> counted by machine and <b>' + fmt(c[8][1])
      + '</b> by hand, on the line beneath. The figure itself is printed nowhere; '
      + 'both of its parts are.</p>'
    : '';
  const combinedNote = c[10]
    ? '<p class="near">The return lists this candidate <b>twice</b> — '
      + c[10].map(fmt).join(' and ') + ' — once among the candidates and '
      + 'again in the write-in list. A write-in for someone already on the ballot '
      + 'is still a vote for them, so the rows are combined here and both are '
      + 'shown; the contest closes on the same total either way.</p>'
    : '';
  const claim = c[1] < 0
    ? 'CivicAtlas says <b>' + esc(cname) + '</b> took <b>' + esc(race.office) + '</b> in ' +
      esc(name) + ' on ' + longDate(race.date) + ' ' +
      (c[1] === -3 ? 'as a write-in whose count the source did not separate from its All '
                   + 'Others total' : 'unopposed, with no per-candidate count published') +
      '. No vote total is claimed, because none exists.'
    : 'CivicAtlas says <b>' + esc(cname) + '</b> received <b>' +
      (c[5] != null ? esc(String(c[5])) : fmt(c[1])) + '</b> votes for <b>' +
      esc(race.office) + '</b> in ' + esc(name) + ' on ' + longDate(race.date) +
      (won ? ', and was elected' : '') + '.';

  // OPEN THE DOCUMENT AT THE PAGE, NOT AT THE FRONT.
  // A thirteen-page scan opened at page one asks the reader to find the row
  // themselves. Nothing is cropped and no images are stored: a PDF opened at
  // `#page=N` is rendered by the browser from the document the town serves.
  function pageLink(r, c) {
    const lp = r.linepages;
    if (!lp) return '';
    const i = (c[4] >= 0 ? c[4] : c[2]);
    let pg = (i >= 0 && i < lp.length) ? lp[i] : null;
    const byContest = (!pg && race && race.contestpage) ? race.contestpage : null;
    if (byContest) pg = byContest;
    if (!pg) return '';
    const u = (r.chain || []).map(s => s.url).filter(Boolean)
      .find(x => /\.pdf(\?|#|$)/i.test(x)) || (/\.pdf(\?|#|$)/i.test(r.url || '') ? r.url : '');
    const shown = c[4] >= 0;
    const at = 'page ' + pg + ' of the document';
    const lead = byContest ? 'Every other row of this contest is on '
      : shown ? 'Printed on ' : 'The name is on ';
    const tail = byContest
      ? ', so this row is printed there too — neither the name nor the '
        + 'figure could be found in our text of that page.'
      : shown ? '.'
      : ', where the figure can be read off the document directly — our '
        + 'text of that page could not be read well enough to show it here.';
    return u
      ? '<p class="cnote">' + lead + '<a href="' + esc(u) + '#page=' + pg +
        '" target="_blank" rel="noopener">' + at + '</a>' + tail + '</p>'
      : '<p class="cnote">' + lead + at + tail + '</p>';
  }

  let h = '<div class="dsec"><h5>The claim</h5><p class="claim">' + claim + '</p></div>';

  if (r.era === 'pre2021') {
    /* A DIFFERENT KIND OF EVIDENCE, DESCRIBED AS ONE.
       These pages were read as images, and the lines were never pooled, so there
       is no line to reproduce. What there is instead is the check the parse ran
       against the page: how many of the names, and how many of the figures, were
       found on it as printed. That is a real and reportable thing, and it is not
       the same thing as showing the reader the line. */
    const g = r.grounded || {};
    h += '<div class="dsec"><h5>How this was checked</h5>' +
      '<div class="grounding">' +
      '<div><div class="k">Names found on the page</div><div class="v">' +
        esc(g.names || '—') + '</div></div>' +
      '<div><div class="k">Figures found on the page</div><div class="v">' +
        esc(g.figures || '—') + '</div></div></div>' +
      '<p class="cnote">This section was read from the page as an image, so there ' +
      'is no line of converted text to show you here. Every name and figure was ' +
      'checked back against the page it was printed on, and the counts above are ' +
      'the result of that check for this town-year as a whole — not for this row ' +
      'on its own. The document itself is the evidence.</p></div>';
  } else {
    h += '<div class="dsec"><h5>The line it was read from</h5>' +
      (c[2] >= 0 && r.lines[c[2]]
        ? facsimile(r.lines[c[2]], cname) +
          (c[4] >= 0 && c[4] !== c[2] && r.lines[c[4]]
            ? '<p class="cnote">and the figure, printed below it in the same ' +
              'column:</p>' + facsimile(r.lines[c[4]], String(c[1]))
            : '') +
          (grounded ? '<p class="cnote">' + grounded + '</p>' : '') +
          nearName + splitNote + combinedNote
        : '<p class="miss">' + (r.has_src
            ? 'This name could not be located anywhere in the converted source text. ' +
              'The vote total may still be right — but on this page, it is unevidenced.'
            : 'No converted source text was kept for this town-year, so the number cannot ' +
              'be traced back to a printed line here.') + '</p>') +
      (r.srcfile ? '<p class="cnote">' + esc(r.srcfile) + '</p>' : '') +
      pageLink(r, c) + '</div>';
  }

  h += '<div class="dsec"><h5>The document</h5>' +
    ((r.chain && r.chain.length)
      ? '<ol class="steps">' + r.chain.map(s =>
          '<li><div class="l">' + esc(s.lab) + '</div><div class="t">' + esc(s.v) + '</div>' +
          (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
                   esc(s.url) + '</a>' : '') + '</li>').join('') + '</ol>'
      : r.url
      ? '<ol class="steps"><li><div class="l">' + esc(r.pub || 'Source') +
        '</div><div class="t">' + esc(r.srcfile || '') + '</div>' +
        '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        esc(r.url) + '</a></li></ol>'
      : '<p class="miss">' + esc(r.url_withheld ||
          'No chain of custody was recorded for this town-year.') + '</p>') + '</div>';

  if (r.conflict && r.conflict.length)
    h += '<div class="dsec"><h5>Where the sources disagree</h5>' +
      '<table class="conf"><thead><tr><th>Office</th><th>This record</th>' +
      '<th>The other account</th></tr></thead><tbody>' +
      r.conflict.map(c => '<tr><td>' + esc(c.office) + '</td><td>' + esc(c.record) +
        '</td><td class="alt">' + esc(c.other) + '</td></tr>').join('') +
      '</tbody></table>' +
      (r.conflict_src ? '<p class="cnote">' + esc(r.conflict_src) + '</p>' : '') +
      (r.conflict_resolved
        ? '<p class="resolved">' + esc(r.conflict_resolved) + '</p>'
        : '<p class="cnote">Unresolved: neither account is preferred here.</p>') +
      '</div>';

  if (r.gaps && r.gaps.length)
    h += '<div class="dsec"><h5>What we cannot show you</h5><ul class="gaps">' +
      r.gaps.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>';

  if (r.bridge && r.bridge.length)
    h += '<div class="dsec"><h5>What reading the document raised</h5><ul class="gaps">' +
      r.bridge.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>';

  const codes = [...new Set([...(race.qa || []), ...(r.qa || [])])];
  if (codes.length)
    h += '<div class="dsec"><h5>Known defects touching this number</h5>' +
      codes.map(q => M.qadefs[q] ? '<div class="qadef ' + M.qadefs[q].sev + '"><b>' +
        esc(M.qadefs[q].lab) + '</b><p>' + esc(M.qadefs[q].why) + '</p></div>' : '').join('') +
      '</div>';

  h += '<div class="dsec"><h5>Extraction</h5><p class="cnote">' +
    'Office as printed: <i>' + esc(race.raw || race.office) + '</i>. Seats: ' +
    (race.eseats ? race.eseats + ' (the record says ' + race.seats + '; the arithmetic ' +
      'closes on ' + race.eseats + ')' : race.seats) +
    (race.seats_src ? ' (' + esc(race.seats_src) + ')' : '') +
    '. Extraction confidence: ' +
    (race.conf == null ? 'not recorded' : race.conf) + '.</p></div>';

  $('#dbody').innerHTML = h;
  $('#dbody').scrollTop = 0;
  $('#dbody').querySelectorAll('[data-raw]').forEach(b => b.onclick = () => {
    const raw = b.closest('.fac').querySelector('.raw');
    const cells = b.closest('.fac').querySelector('.cells');
    const showing = raw.hidden;
    raw.hidden = !showing; cells.hidden = showing;
    b.textContent = showing ? 'reconstructed' : 'exact text';
  });
  $('#drawer').setAttribute('data-open', 'true');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#scrim').setAttribute('data-open', 'true');
  $('#dx').focus();
}
function closeProv() {
  $('#drawer').setAttribute('data-open', 'false');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#scrim').setAttribute('data-open', 'false');
}
$('#dx').onclick = closeProv;
$('#scrim').onclick = closeProv;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProv(); });

/* =====================================================================
   Decided by a handful
   ===================================================================== */
seg($('#segThr'), M.thresholds.map(t => [t, (+t * 100) + '%']), THR,
    v => { THR = v; drawMargins(); });
seg($('#segDir'), [['close', 'Closest'], ['wide', 'Widest']], DIR, v => { DIR = v; drawMargins(); });
/* Share is the default. A 4-vote margin in a town of 300 and a 4-vote margin in
   a city of 40,000 are not the same event, and sorting by the raw gap puts the
   large towns at the top of a list that is about how close a race was. */
seg($('#segBy'), [['pct', 'By share'], ['gap', 'By votes']], BY, v => { BY = v; drawMargins(); });

function drawMargins() {
  const list = (M[DIR + (BY === 'pct' ? '_pct' : '')][THR] || []).slice(0, 15);
  const rows = list.map(d =>
    '<tr><td><button class="town" data-t="' + esc(d.muni) + '" data-y="' + d.year + '">' +
      esc(d.muni) + '</button> <span class="who">' + d.year + '</span></td>' +
    '<td>' + esc(d.office) + '</td>' +
    '<td class="n"><b>' + fmt(d.gap) + '</b></td>' +
    '<td class="n">' + (d.pct * 100).toFixed(2) + '%</td>' +
    '<td class="who">' + esc(d.won) + ' ' + fmt(d.won_v) + ' &middot; ' +
      esc(d.lost) + ' ' + fmt(d.lost_v) + '</td>' +
    '<td class="n">' + fmt(d.cast) + '</td></tr>').join('');

  const T = M.ties[THR] || [];
  const ties = T.length ? '<p class="cnote"><b>' + T.length +
    ' ended in an exact tie</b>: ' +
    T.slice(0, 6).map(t => esc(t.muni) + ' ' + t.year + ' (' + esc(t.office) + ')').join('; ') +
    '.</p>' : '';

  $('#marginTable').innerHTML = '<table><thead><tr><th>Municipality</th><th>Office</th>' +
    '<th class="n">Margin</th><th class="n">Share</th>' +
    '<th>Winner of the last seat &middot; runner-up</th><th class="n">Ballots</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="cnote">' + fmt(M.contested_at[THR]) +
    ' contested races at this threshold, 2021–2026. The earlier years are not ' +
    'in this table: their coverage is too partial for a ranking to mean much.</p>' + ties;
  $('#marginTable').querySelectorAll('button.town').forEach(b => b.onclick = () => {
    TOWN = b.dataset.t; setYear(b.dataset.y);
    $('#town').scrollIntoView({block: 'start'});
  });
}

/* =====================================================================
   boot
   ===================================================================== */
$('#mastcount').innerHTML = fmt(S.town_years) + ' town-years · ' +
  fmt(S.races) + ' contests · ' + fmt(S.cands) + ' candidates, 2021–2026';

$('#foot').innerHTML =
  '<b>Results</b> from 351 municipal clerks, town websites, annual reports and local ' +
  'news, mirrored and converted to text. <b>Registered voters</b> from the Secretary ' +
  'of the Commonwealth: seven published snapshots, interpolated to each election date ' +
  'and reconciled against every county total. <b>Boundaries</b> from the MassGIS ' +
  'municipal survey, rotated ' + G.rotation.toFixed(1) + '° onto the smallest ' +
  'rectangle that encloses the Commonwealth. There is no state archive of these ' +
  'offices; PD43+ covers state and federal races only.' +
  /* THIS SENTENCE MUST NOT ROUND ITSELF UP.
     It read "53,322 of 53,529 candidate rows (100%)" -- a claim that printed its
     own numerator and denominator and then contradicted them, because 99.61
     rounds to 100 at zero decimals. 207 rows do not trace. Of every figure on
     this page it is the one whose entire job is to be trustworthy, so it floors
     rather than rounds and can never claim a row it has not got. It also says
     which years it is speaking for: the earlier era is a separate set and is
     not counted here. */
  '<br><br>' + fmt(S.lines_matched) + ' of ' + fmt(S.cands) + ' candidate rows in ' +
  '2021–2026 (' + pctDown(S.lines_matched / S.cands, 1) + ') trace to a literal ' +
  'line of source text; ' + fmt(S.cands - S.lines_matched) + ' do not. ' +
  'Data generated ' + esc(M.generated) + '. Method: <a href="README.md">README</a>. ' +
  '<a href="../coverage.html">Coverage</a> · <a href="../">All data</a>.';

drawMap(); repaint(); drawTown(); drawMargins();
</script>
</body>
</html>
